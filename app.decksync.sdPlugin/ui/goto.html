<!DOCTYPE html>
<html>
<head lang="en">
	<meta charset="utf-8" />
	<title>DeckSync go to page</title>
	<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
	<div id="targets">
		<sdpi-item label="All decks"><span style="color:#999">Loading…</span></sdpi-item>
	</div>
	<p style="color:#999;font-size:11px;margin:8px 12px;line-height:1.4">
		Pressing the key (or dial) sends the decks to the pages you pick, including the deck the key is on.<br>
		"All decks" moves every deck to the same page and overrides the fields below. "Unchanged" = that deck stays put.<br>
		Page names come from the Stream Deck app. Only connected decks are listed.
	</p>
	<script>
		(async () => {
			const { streamDeckClient } = SDPIComponents;
			const g = (await streamDeckClient.getGlobalSettings()) || {};
			const count = Number(g.pages) > 0 ? Number(g.pages) : 10;
			const names = g.pageNames || {};
			const devices = Array.isArray(g.devices) ? g.devices : [];
			const el = document.getElementById("targets");
			el.innerHTML = "";

			const addSelect = (label, setting, list, emptyText) => {
				const item = document.createElement("sdpi-item");
				item.setAttribute("label", label);
				const select = document.createElement("sdpi-select");
				select.setAttribute("setting", setting);
				const none = document.createElement("option");
				none.value = "";
				none.textContent = emptyText;
				select.appendChild(none);
				for (let n = 1; n <= count; n++) {
					const opt = document.createElement("option");
					opt.value = String(n);
					const name = list && typeof list[n - 1] === "string" ? list[n - 1].trim() : "";
					opt.textContent = name ? `Page ${n} · ${name}` : `Page ${n}`;
					select.appendChild(opt);
				}
				item.appendChild(select);
				el.appendChild(item);
			};

			addSelect("All decks", "all", null, "Per deck (below)");
			for (const d of devices) {
				const custom = typeof g["deckname_" + d.id] === "string" ? g["deckname_" + d.id].trim() : "";
				addSelect(custom || d.name, "page_" + d.id, names[d.profile], "Unchanged");
			}
		})();
	</script>
</body>
</html>
