<!DOCTYPE html>
<html>
<head lang="en">
	<meta charset="utf-8" />
	<title>DeckSync folder</title>
	<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
	<div id="target">
		<sdpi-item label="Opens page"><span style="color:#999">Loading…</span></sdpi-item>
	</div>
	<p style="color:#999;font-size:11px;margin:8px 12px;line-height:1.4">
		Pressing the key takes this deck to that page. The other decks stay where they are, until one of them turns the page.<br>
		The key shows the page's name and icon from the Stream Deck app. Put a Back key on the folder page to return.
	</p>
	<script>
		(async () => {
			const { streamDeckClient } = SDPIComponents;
			const info = await streamDeckClient.getConnectionInfo();
			const deviceId = info && info.actionInfo && info.actionInfo.device;
			const g = (await streamDeckClient.getGlobalSettings()) || {};
			const count = Number(g.pages) > 0 ? Number(g.pages) : 10;
			const devices = Array.isArray(g.devices) ? g.devices : [];
			const me = devices.find((d) => d.id === deviceId);
			const names = (g.pageNames && me && g.pageNames[me.profile]) || [];
			const el = document.getElementById("target");
			el.innerHTML = "";
			const item = document.createElement("sdpi-item");
			item.setAttribute("label", "Opens page");
			const select = document.createElement("sdpi-select");
			select.setAttribute("setting", "page");
			const none = document.createElement("option");
			none.value = "";
			none.textContent = "Pick a page";
			select.appendChild(none);
			for (let n = 1; n <= count; n++) {
				const opt = document.createElement("option");
				opt.value = String(n);
				const name = typeof names[n - 1] === "string" ? names[n - 1].trim() : "";
				opt.textContent = name ? `p${n} · ${name}` : `Page ${n}`;
				select.appendChild(opt);
			}
			item.appendChild(select);
			el.appendChild(item);
		})();
	</script>
</body>
</html>
